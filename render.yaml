services:
  - type: web
    name: campusfix-app
    env: node
    plan: starter
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: campusfix-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true

databases:
  - name: campusfix-db
    plan: starter
    databaseName: campusfix
    user: campusfix_user
